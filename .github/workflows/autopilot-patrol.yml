name: Autopilot patrol
# 見回り係（AIなし）：CIが赤い・競合したPRを1件だけ実装係に回し、滞ったIssueに stuck を付ける
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: autopilot-patrol
  cancel-in-progress: false
jobs:
  look:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      number: ${{ steps.look.outputs.number }}
      mode: ${{ steps.look.outputs.mode }}
      executor: ${{ steps.look.outputs.executor }}
    steps:
      - name: Look for PRs and issues that need help
        id: look
        env:
          GH_TOKEN: ${{ secrets.AUTOPILOT_PAT }}
          AUTOPILOT: ${{ vars.AUTOPILOT }}
          EXECUTOR: ${{ vars.AUTOPILOT_EXECUTOR || 'claude' }}
          REPO: ${{ github.repository }}
          ALLOW: ${{ vars.AUTOPILOT_ALLOW || 'hane-san,chatgpt-codex-connector[bot],claude[bot]' }}
        run: |
          [ "$AUTOPILOT" = "on" ] || { echo "AUTOPILOT=off"; exit 0; }
          [ -n "$GH_TOKEN" ] || { echo "::warning::AUTOPILOT_PAT が未設定"; exit 0; }
          now=$(date -u +%s)
          # 24時間PRが出ていない in-progress は stuck
          for n in $(gh issue list -R "$REPO" --state open --label in-progress --json number --jq '.[].number'); do
            open=$(gh pr list -R "$REPO" --state open --search "Closes #$n in:body" --json number --jq 'length')
            upd=$(date -u -d "$(gh issue view "$n" -R "$REPO" --json updatedAt --jq .updatedAt)" +%s)
            if [ "$open" = "0" ] && [ $((now - upd)) -gt 86400 ]; then
              gh issue edit "$n" -R "$REPO" --remove-label in-progress --add-label stuck
            fi
          done
          gh pr list -R "$REPO" --state open --limit 50 \
            --json number,author,isCrossRepository,labels,mergeable,statusCheckRollup,updatedAt > prs.json
          pick=$(jq -r --arg allow ",$ALLOW," '
            [ .[]
              | select(.isCrossRepository | not)
              | select(($allow | contains("," + .author.login + ",")) or ($allow | contains(",app/" + .author.login + ",")))
              | . as $p | ([.labels[].name]) as $l
              | select(($l | index("hold") | not) and ($l | index("stuck") | not))
              | if .mergeable == "CONFLICTING" then
                  (if ($l | index("conflict-asked")) then {n:.number, act:"stuck"} else {n:.number, act:"conflict"} end)
                elif ([.statusCheckRollup[]? | select(.conclusion == "FAILURE")] | length) > 0 then
                  (if ($l | index("ci-asked")) then {n:.number, act:"stuck"} else {n:.number, act:"fix"} end)
                else empty end
            ] | first // empty | "\(.n) \(.act)"' prs.json)
          [ -n "$pick" ] || { echo "助けが要るPRなし"; exit 0; }
          set -- $pick
          if [ "$2" = "stuck" ]; then gh pr edit "$1" -R "$REPO" --add-label stuck; exit 0; fi
          label=$([ "$2" = "fix" ] && echo ci-asked || echo conflict-asked)
          gh pr edit "$1" -R "$REPO" --add-label "$label"
          { echo "number=$1"; echo "mode=$2"; echo "executor=$EXECUTOR"; } >> "$GITHUB_OUTPUT"
  codex:
    needs: look
    if: needs.look.outputs.number != '' && needs.look.outputs.executor == 'codex'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ask Codex
        env:
          GH_TOKEN: ${{ secrets.AUTOPILOT_PAT }}
          MODE: ${{ needs.look.outputs.mode }}
        run: |
          if [ "$MODE" = "fix" ]; then msg="@codex fix the CI failures"; else msg="@codex merge the latest main into this branch and resolve the conflicts"; fi
          gh pr comment "${{ needs.look.outputs.number }}" -R "${{ github.repository }}" --body "$msg"
  claude:
    needs: look
    if: needs.look.outputs.number != '' && needs.look.outputs.executor == 'claude'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    uses: ./.github/workflows/autopilot-claude.yml
    with:
      mode: ${{ needs.look.outputs.mode }}
      number: ${{ needs.look.outputs.number }}
    secrets: inherit
