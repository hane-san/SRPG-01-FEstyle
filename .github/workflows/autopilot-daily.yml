name: Autopilot daily report
# 日報係（AIなし）：毎日18時（日本時間）に「自動操縦の日報」Issueへ1件コメントする。何も止めない
on:
  schedule:
    - cron: "3 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Post the report
        env:
          GH_TOKEN: ${{ secrets.AUTOPILOT_PAT }}
          REPO: ${{ github.repository }}
          AUTOPILOT: ${{ vars.AUTOPILOT }}
          EXECUTOR: ${{ vars.AUTOPILOT_EXECUTOR || 'claude' }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::warning::AUTOPILOT_PAT が未設定"; exit 0; }
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          list() { gh issue list -R "$REPO" --state open --label "$1" --json number,title --jq '.[] | "- #\(.number) \(.title)"'; }
          merged=$(gh pr list -R "$REPO" --state merged --search "merged:>=$since" --json number,title --jq '.[] | "- #\(.number) \(.title)"')
          prs=$(gh pr list -R "$REPO" --state open --json number,title --jq '.[] | "- #\(.number) \(.title)"')
          body="## 自動操縦の日報（$(TZ=Asia/Tokyo date +%Y-%m-%d)）
          - AUTOPILOT：${AUTOPILOT:-未設定}　実装係：$EXECUTOR

          ### 24時間以内にマージ
          ${merged:-なし}

          ### 開いているPR
          ${prs:-なし}

          ### 進行中（in-progress）
          $(list in-progress)

          ### 助けが要る（stuck）
          $(list stuck)

          ### 質問中（needs-info）
          $(list needs-info)

          ### Claude Code で直接頼むもの（lane/claude）
          $(list lane/claude)

          ※ PAT の有効期限は GitHub の Settings → Developer settings → Fine-grained tokens で確認してください。"
          n=$(gh issue list -R "$REPO" --state open --search '自動操縦の日報 in:title' --json number --jq '.[0].number // empty')
          [ -n "$n" ] || n=$(gh issue create -R "$REPO" --title "自動操縦の日報" --body "自動操縦の日報を1日1件コメントします。" | grep -o '[0-9]*$')
          printf '%s\n' "$body" | sed 's/^          //' | gh issue comment "$n" -R "$REPO" --body-file -
