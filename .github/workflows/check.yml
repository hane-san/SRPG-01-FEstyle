name: SRPG rules
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
  browser:
    # Playwright 1.57 cannot install Chromium's system dependencies on ubuntu-latest's newer image (Ubuntu 26.04),
    # so the browser job stays on the newest image it supports. The tests themselves are unchanged.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          npm run dev > /tmp/srpg-http.log 2>&1 &
          node --input-type=module -e 'for(let i=0;i<30;i++){try{const r=await fetch("http://localhost:4173");if(r.ok)process.exit(0);}catch{}await new Promise(r=>setTimeout(r,200));}process.exit(1);'
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: half-hp-motion-preview
          path: test-results/half113-*.png
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
