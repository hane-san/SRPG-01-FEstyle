name: Autopilot arm
# 許可リストのPRに auto-merge（merge commit）を仕掛ける。合否は必須チェックが決める
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  arm:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTOPILOT_PAT }}
          PR: ${{ github.event.pull_request.number }}
          DRAFT: ${{ github.event.pull_request.draft }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          AUTOPILOT: ${{ vars.AUTOPILOT }}
          ALLOW: ${{ vars.AUTOPILOT_ALLOW || 'hane-san,chatgpt-codex-connector[bot],claude[bot]' }}
        run: |
          case ",$ALLOW," in *",$AUTHOR,"*) ;; *) echo "許可リスト外: $AUTHOR"; exit 0;; esac
          case ",$LABELS," in *",revert,"*) ;; *) [ "$AUTOPILOT" = "on" ] || { echo "AUTOPILOT=off のため仕掛けない"; exit 0; };; esac
          if [ -z "$GH_TOKEN" ]; then echo "::warning::AUTOPILOT_PAT が未設定"; exit 0; fi
          if [ "$DRAFT" = "true" ]; then gh pr ready "$PR" -R "${{ github.repository }}"; fi
          gh pr merge "$PR" -R "${{ github.repository }}" --auto --merge \
            || echo "::warning::auto-merge を仕掛けられなかった（Allow auto-merge と Ruleset の設定を確認）"
